<div class="cta-banner" [appScrollReveal]="0">
  <div class="cta-left">
    <div class="cta-badge">7 DIAS GRÁTIS</div>
    <h2>Pronto para automatizar seu restaurante?</h2>
    <p>Comece agora mesmo e veja a diferença no seu atendimento!</p>
  </div>
  <div class="cta-mid">
    <a routerLink="/planos" class="btn btn-primary">
      Começar grátis agora
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        width="15"
        height="15"
      >
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </a>
    <div class="cta-sub">
      <span>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="2" y="6" width="20" height="12" rx="2" />
          <path d="M2 10h20" />
        </svg>
        Sem cartão de crédito
      </span>
      <span>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M9 12l2 2 4-4" />
        </svg>
        Cancelamento fácil
      </span>
    </div>
  </div>
  <div class="cta-icon-badge">
   <img src="assets/logo.png">
  </div>
</div>
