<section id="como-funciona">
  <h2 class="section-title">Como funciona</h2>
  <div class="steps">
    <div class="step" *ngFor="let step of steps; let i = index" [appScrollReveal]="i * 120">
      <div class="step-icon-wrap">
        <div class="step-icon">
          <svg *ngIf="i === 0" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.4c1.4.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm5.1 14.2c-.2.6-1.2 1.1-1.7 1.2-.5.1-1 .1-3.2-.7-2.7-1.1-4.4-3.8-4.6-4-.1-.2-1.1-1.4-1.1-2.7 0-1.3.7-1.9.9-2.2.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.6.7 1.9.8 2 .1.2.1.4 0 .6-.5 1-1.1 1.2-.6 1.9.8 1.2 1.5 1.7 2.6 2.3.2.1.3.1.5-.1.2-.2.7-.8.9-1.1.2-.2.4-.3.6-.2.2.1 1.5.7 1.8.9.3.1.5.2.5.4.1.2.1.7-.2 1.3z"
            />
          </svg>
          <svg
            *ngIf="i === 1"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="5" y="8" width="14" height="10" rx="2" />
            <path d="M9 8V5a3 3 0 016 0v3M9 13h.01M15 13h.01" />
          </svg>
          <svg
            *ngIf="i === 2"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
            <path d="M14 2v6h6M9 13h6M9 17h6" />
          </svg>
        </div>
        <div class="step-connector" *ngIf="i < steps.length - 1"></div>
      </div>
      <h3>{{ step.title }}</h3>
      <p>{{ step.desc }}</p>
    </div>
  </div>
</section>
